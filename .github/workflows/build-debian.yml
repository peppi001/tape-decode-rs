name: Build Debian 12

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-x86-64:
    name: Debian 12 x86-64 (v1-v4 + alderlake)
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl git \
            libssl-dev pkg-config tar xz-utils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build all microarchitecture levels
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          declare -A levels=(
            ["x86-64-v1"]="x86-64"
            ["x86-64-v2"]="x86-64-v2"
            ["x86-64-v3"]="x86-64-v3"
            ["x86-64-v4"]="x86-64-v4"
            ["alderlake"]="alderlake"
          )
          mkdir -p dist
          for name in x86-64-v1 x86-64-v2 x86-64-v3 x86-64-v4 alderlake; do
            cpu="${levels[$name]}"
            echo "Building $name (target-cpu=$cpu)"
            RUSTFLAGS="-C target-cpu=$cpu" CARGO_TARGET_DIR="target-$name" \
              cargo build --locked --release --target x86_64-unknown-linux-gnu --bin tape-decode
            mkdir -p "dist/$name"
            cp "target-$name/x86_64-unknown-linux-gnu/release/tape-decode" "dist/$name/tape-decode"
            objcopy --only-keep-debug "dist/$name/tape-decode" "dist/$name/tape-decode.debug"
            strip --strip-debug --strip-unneeded "dist/$name/tape-decode"
            objcopy --add-gnu-debuglink="dist/$name/tape-decode.debug" "dist/$name/tape-decode"
          done

      - name: Package debian12.tar.xz
        shell: bash
        run: |
          set -euo pipefail
          tar -cJf debian12.tar.xz -C dist .

      - name: Upload debian12.tar.xz
        uses: actions/upload-artifact@v7
        with:
          name: debian12
          path: debian12.tar.xz
          if-no-files-found: error
